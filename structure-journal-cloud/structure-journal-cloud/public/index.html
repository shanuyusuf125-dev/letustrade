<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Structure Journal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="styles.css" />
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <span class="brand-mark">MS</span>
          <span class="brand-name">Structure Journal</span>
        </div>
        <div class="trade-count" id="tradeCount">-- trades</div>
      </div>
      <div class="trade-list" id="tradeList">
        <div class="empty-state">Loading trades…</div>
      </div>
      <div class="sidebar-footer">
        <button id="trashToggleBtn" class="trash-toggle">🗑 Trash (<span id="trashCount">0</span>)</button>
        <button id="syncCloudBtn" class="trash-toggle" style="margin-top:6px;">☁ Sync to Cloud</button>
        <div id="syncStatus" class="hint" style="margin-top:6px;"></div>
      </div>
    </aside>

    <main class="main">
      <div id="emptyPanel" class="empty-panel">
        <p>Select a trade on the left to review it.</p>
        <p class="hint">This reads straight from your MT5 exports — no screenshots, real OHLC data.</p>
      </div>

      <div id="trashPanel" class="trash-panel" style="display:none;">
        <h2>Trash</h2>
        <p class="hint">Deleted trades land here first, not gone permanently. Restore or purge them.</p>
        <div id="trashList"></div>
      </div>

      <div id="tradePanel" class="trade-panel" style="display:none;">
        <header class="trade-header">
          <div>
            <span class="symbol" id="tSymbol">—</span>
            <span class="direction" id="tDirection">—</span>
            <span class="status-pill" id="tStatus">—</span>
          </div>
          <div class="trade-meta">
            <div><span class="label">Open</span><span id="tOpenPrice">—</span></div>
            <div><span class="label">Close</span><span id="tClosePrice">—</span></div>
            <div><span class="label">Profit</span><span id="tProfit">—</span></div>
            <div><span class="label">R</span><span id="tR">—</span></div>
            <div><span class="label">Time</span><span id="tTime">—</span></div>
            <div><button id="deleteTradeBtn" class="delete-btn">Move to Trash</button></div>
          </div>
        </header>

        <div class="tf-tabs" id="tfTabs"></div>

        <div class="chart-wrap">
          <div id="chart"></div>
        </div>

        <section class="notes-section">
          <h3>Your notes</h3>
          <textarea id="noteText" placeholder="What was your reasoning? What would you do differently?"></textarea>
          <div class="notes-row">
            <select id="noteStrategy">
              <option value="">Strategy…</option>
            </select>
            <input id="noteTags" type="text" placeholder="tags, comma, separated" />
            <select id="noteRating">
              <option value="">Rate setup…</option>
              <option value="1">1 — poor</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5 — excellent</option>
            </select>
            <button id="saveNoteBtn">Save</button>
          </div>
          <div id="saveStatus" class="save-status"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
